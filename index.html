<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="AI 时代 E-E-A-T 与内容可信度指南在线阅读页">
  <title>E-E-A-T 内容可信度指南</title>

  <style>
    /* ============================================================
       E-E-A-T Content Trust Guide
       01. Variables
       02. Reset / Base
       03. Header / Progress
       04. Desktop Layout
       05. Left Navigation
       06. Main Document
       07. Right TOC
       08. Markdown
       09. GitHub Alerts
       10. Mobile
       ============================================================ */

    :root {
      --page-bg: #ffffff;
      --sidebar-bg: #f7f8f8;
      --surface: #f5f6f5;
      --surface-soft: #fafbfa;
      --text-strong: #1f2428;
      --text-main: #30363d;
      --text-soft: #59636e;
      --text-muted: #7d8590;
      --line: #e6e8eb;
      --line-strong: #d7dadd;
      --brand: #079f7b;
      --brand-soft: #e8f7f2;
      --link: #0969da;
      --header-height: 62px;
      --left-width: 300px;
      --right-width: 260px;
      --article-width: 880px;
      --radius: 8px;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-height) + 26px);
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page-bg);
      color: var(--text-strong);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a,
    summary {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    ::selection {
      background: #dff5ee;
      color: #111;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-height);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      height: 100%;
      padding: 0 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      display: block;
      color: var(--text-strong);
      font-size: 15px;
      font-weight: 720;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.2;
    }

    .header-meta {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .reading-progress {
      position: fixed;
      z-index: 120;
      top: calc(var(--header-height) - 2px);
      left: 0;
      width: 0;
      height: 2px;
      background: var(--brand);
      transition: width .08s linear;
    }

    .docs-layout {
      display: grid;
      grid-template-columns: var(--left-width) minmax(0, 1fr) var(--right-width);
      min-height: calc(100vh - var(--header-height));
    }

    .left-sidebar {
      min-width: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
    }

    .left-inner {
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));
      padding: 24px 26px 42px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .main-content {
      min-width: 0;
      padding: 48px 50px 100px;
    }

    .doc-article {
      width: min(100%, var(--article-width));
      margin: 0 auto;
    }

    .right-sidebar {
      min-width: 0;
      padding: 46px 24px 70px 0;
    }

    .nav-label,
    .toc-label {
      margin: 0 0 13px;
      color: #41484f;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .06em;
    }

    .chapter-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chapter-link {
      position: relative;
      display: block;
      padding: 9px 10px;
      border-radius: 6px;
      color: #636c76;
      font-size: 13.5px;
      line-height: 1.48;
      text-decoration: none;
      transition: color .18s ease, background-color .18s ease;
    }

    .chapter-link:hover {
      color: var(--text-strong);
      background: rgba(0, 0, 0, .035);
    }

    .chapter-link.is-active {
      color: var(--brand);
      background: var(--brand-soft);
      font-weight: 680;
    }

    .chapter-link.is-active::before {
      content: "";
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: -26px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--brand);
    }

    .nav-tip {
      margin: 26px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line-strong);
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.65;
    }

    .doc-status {
      display: none;
      margin: 0 0 24px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-soft);
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.65;
    }

    .doc-status.is-visible {
      display: block;
    }

    .doc-status.is-error {
      border-color: #f0d0d0;
      background: #fff7f7;
      color: #8a2d2d;
    }

    .local-file-btn {
      display: inline-flex;
      align-items: center;
      margin-top: 10px;
      padding: 7px 11px;
      border: 1px solid #d4d7da;
      border-radius: 6px;
      background: #fff;
      color: var(--text-strong);
      cursor: pointer;
    }

    .local-file-btn:hover {
      border-color: #aeb4ba;
      background: #fafafa;
    }

    #local-file {
      display: none;
    }

    .toc-card {
      position: sticky;
      top: calc(var(--header-height) + 42px);
      max-height: calc(100vh - var(--header-height) - 72px);
      padding-left: 17px;
      overflow-y: auto;
      border-left: 1px solid var(--line-strong);
      scrollbar-width: thin;
    }

    .toc-chapter {
      margin: 0 0 10px;
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.45;
    }

    .section-toc {
      display: flex;
      flex-direction: column;
    }

    .section-link {
      position: relative;
      display: block;
      padding: 7px 0;
      color: #747d86;
      font-size: 12.8px;
      line-height: 1.48;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: color .18s ease;
    }

    .section-link:hover {
      color: var(--text-strong);
    }

    .section-link.is-active {
      color: var(--brand);
      font-weight: 680;
    }

    .section-link.is-active::before {
      content: "";
      position: absolute;
      top: 7px;
      bottom: 7px;
      left: -18px;
      width: 2px;
      background: var(--brand);
    }

    .toc-empty {
      margin: 0;
      color: #9aa1a8;
      font-size: 12px;
      line-height: 1.6;
    }

    .markdown-body {
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.72;
      overflow-wrap: break-word;
    }

    .markdown-body > :first-child {
      margin-top: 0 !important;
    }

    .markdown-body > h1:first-child {
      margin: 0 0 1.3em;
      padding-bottom: .85em;
      border-bottom: 1px solid var(--line-strong);
      color: var(--text-strong);
      font-size: clamp(30px, 3.2vw, 39px);
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      color: var(--text-strong);
      font-weight: 720;
      line-height: 1.36;
      scroll-margin-top: calc(var(--header-height) + 28px);
    }

    .markdown-body h1 {
      margin: 1.8em 0 .65em;
      font-size: 30px;
    }

    .markdown-body h2 {
      margin: 2.15em 0 .7em;
      padding-top: .05em;
      font-size: 25px;
      letter-spacing: -.02em;
    }

    .markdown-body h3 {
      margin: 1.65em 0 .58em;
      font-size: 19px;
      letter-spacing: -.012em;
    }

    .markdown-body h4 {
      margin: 1.45em 0 .5em;
      font-size: 16.5px;
    }

    .markdown-body p {
      margin: 0 0 1em;
    }

    .markdown-body strong {
      color: var(--text-strong);
      font-weight: 700;
    }

    .markdown-body a {
      color: var(--link);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .markdown-body a:hover {
      color: #034ea2;
    }

    .markdown-body hr {
      margin: 2.2em 0;
      border: 0;
      border-top: 1px solid var(--line-strong);
    }

    .markdown-body ul,
    .markdown-body ol {
      margin: 0 0 1em;
      padding-left: 1.55em;
    }

    .markdown-body li {
      margin: .28em 0;
      padding-left: .08em;
    }

    .markdown-body li::marker {
      color: #666e76;
    }

    .markdown-body .task-list-item {
      list-style: none;
    }

    .markdown-body .task-list-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin: 0 .55em 0 -1.45em;
      vertical-align: -.12em;
      accent-color: var(--brand);
      pointer-events: none;
    }

    .markdown-body blockquote {
      margin: 1.25em 0;
      padding: .12em 0 .12em 1em;
      border-left: 3px solid var(--line-strong);
      color: var(--text-soft);
    }

    .markdown-body blockquote > :first-child {
      margin-top: 0;
    }

    .markdown-body blockquote > :last-child {
      margin-bottom: 0;
    }

    .markdown-body code,
    .markdown-body kbd,
    .markdown-body samp {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .markdown-body :not(pre) > code {
      padding: .1em .32em;
      border: 1px solid #e4e6e8;
      border-radius: 4px;
      background: #f4f5f4;
      color: #30343a;
      font-size: .86em;
    }

    .markdown-body pre {
      max-width: 100%;
      margin: 1.3em 0;
      padding: 17px 19px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }

    .markdown-body pre code {
      display: block;
      min-width: max-content;
      padding: 0;
      border: 0;
      background: transparent;
      color: #2d333b;
      font-size: 13.5px;
      line-height: 1.58;
      white-space: pre;
    }

    .table-scroll {
      width: 100%;
      margin: 1.35em 0;
      overflow-x: auto;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      -webkit-overflow-scrolling: touch;
    }

    .markdown-body table {
      width: 100%;
      min-width: 620px;
      margin: 0;
      border-collapse: collapse;
      font-size: 14px;
      line-height: 1.55;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 9px 11px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th:last-child,
    .markdown-body td:last-child {
      border-right: 0;
    }

    .markdown-body tr:last-child td {
      border-bottom: 0;
    }

    .markdown-body th {
      background: #f3f4f3;
      color: var(--text-strong);
      font-weight: 680;
      white-space: nowrap;
    }

    .markdown-body tbody tr:nth-child(even) td {
      background: var(--surface-soft);
    }

    .markdown-body details {
      margin: 1.25em 0;
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #fff;
    }

    .markdown-body summary {
      cursor: pointer;
      color: var(--text-strong);
      font-weight: 680;
      line-height: 1.6;
    }

    .markdown-body details[open] summary {
      margin-bottom: .8em;
    }

    .markdown-body img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.5em auto;
      border-radius: var(--radius);
    }

    .markdown-body blockquote.md-alert {
      padding: 13px 15px;
      border: 1px solid var(--line-strong);
      border-left-width: 4px;
      border-radius: var(--radius);
      background: #fbfcfc;
      color: var(--text-main);
    }

    .md-alert-title {
      display: block;
      margin: 0 0 5px;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: .02em;
    }

    .md-alert-note,
    .md-alert-tip {
      border-left-color: #238636 !important;
      background: #f4fbf6 !important;
    }

    .md-alert-important {
      border-left-color: #8250df !important;
      background: #faf7ff !important;
    }

    .md-alert-warning {
      border-left-color: #bf8700 !important;
      background: #fffaf0 !important;
    }

    .md-alert-caution {
      border-left-color: #cf222e !important;
      background: #fff6f6 !important;
    }

    .mobile-tools,
    .drawer,
    .page-mask {
      display: none;
    }

    @media (max-width: 1199px) {
      :root {
        --left-width: 270px;
      }

      .docs-layout {
        grid-template-columns: var(--left-width) minmax(0, 1fr);
      }

      .right-sidebar {
        display: none;
      }

      .main-content {
        padding-right: 42px;
        padding-left: 42px;
      }
    }

    @media (max-width: 860px) {
      :root {
        --header-height: 58px;
      }

      body.is-locked {
        overflow: hidden;
      }

      .header-inner {
        padding: 0 18px;
      }

      .brand-subtitle,
      .header-meta {
        display: none;
      }

      .docs-layout {
        display: block;
      }

      .left-sidebar {
        display: none;
      }

      .main-content {
        padding: 28px 20px 78px;
      }

      .mobile-tools {
        position: sticky;
        z-index: 90;
        top: var(--header-height);
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, .97);
      }

      .mobile-tool {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 45px;
        padding: 0 12px;
        border: 0;
        background: transparent;
        color: #4f5861;
        font-size: 13px;
        cursor: pointer;
      }

      .mobile-tool + .mobile-tool {
        border-left: 1px solid var(--line);
      }

      .mobile-tool svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .drawer {
        position: fixed;
        z-index: 210;
        top: var(--header-height);
        bottom: 0;
        display: block;
        width: min(86vw, 330px);
        padding: 22px 22px 36px;
        overflow-y: auto;
        background: #fff;
        box-shadow: 12px 0 40px rgba(20, 24, 28, .12);
        transition: transform .25s var(--ease);
      }

      .drawer--left {
        left: 0;
        transform: translateX(-105%);
      }

      .drawer--right {
        right: 0;
        transform: translateX(105%);
        box-shadow: -12px 0 40px rgba(20, 24, 28, .12);
      }

      .drawer.is-open {
        transform: translateX(0);
      }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .drawer-head strong {
        font-size: 14px;
      }

      .drawer-close {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--surface);
        cursor: pointer;
      }

      .drawer-close svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
      }

      .page-mask {
        position: fixed;
        inset: 0;
        z-index: 190;
        display: block;
        visibility: hidden;
        border: 0;
        background: rgba(20, 22, 24, .5);
        opacity: 0;
        pointer-events: none;
        transition: opacity .22s ease, visibility 0s linear .22s;
      }

      .page-mask.is-open {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        transition-delay: 0s;
      }

      .drawer .chapter-link.is-active::before,
      .drawer .section-link.is-active::before {
        left: -22px;
      }

      .markdown-body {
        font-size: 15.5px;
        line-height: 1.72;
      }

      .markdown-body > h1:first-child {
        font-size: 28px;
      }

      .markdown-body h2 {
        margin-top: 1.9em;
        font-size: 22px;
      }

      .markdown-body h3 {
        font-size: 18px;
      }
    }

    @media (max-width: 480px) {
      .main-content {
        padding-right: 17px;
        padding-left: 17px;
      }

      .brand-title {
        max-width: 210px;
      }

      .markdown-body > h1:first-child {
        font-size: 26px;
      }

      .markdown-body pre {
        margin-right: -4px;
        margin-left: -4px;
        padding: 15px 14px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="返回文档顶部">
        <span class="brand-mark">EAT</span>
        <span class="brand-text">
          <span class="brand-title">E-E-A-T 内容可信度指南</span>
          <span class="brand-subtitle">经验 · 专业 · 证据 · 信任</span>
        </span>
      </a>
      <span class="header-meta">README.md</span>
    </div>
  </header>

  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>

  <div class="mobile-tools" aria-label="移动端文档工具栏">
    <button class="mobile-tool" id="chapter-toggle" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"></path></svg>
      <span>章节目录</span>
    </button>
    <button class="mobile-tool" id="section-toggle" type="button">
      <span>本节导航</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </button>
  </div>

  <div class="docs-layout">
    <aside class="left-sidebar" aria-label="章节目录">
      <div class="left-inner">
        <p class="nav-label">章节目录</p>
        <nav class="chapter-nav" id="chapter-nav"></nav>
        <p class="nav-tip">做过 · 做好 · 被认可 · 所以相信。再多问一句：证据呢？</p>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <article class="doc-article" id="top">
        <div class="doc-status" id="doc-status" role="status" aria-live="polite"></div>
        <input id="local-file" type="file" accept=".md,text/markdown,text/plain">
        <div class="markdown-body" id="doc-body"></div>
      </article>
    </main>

    <aside class="right-sidebar" aria-label="当前章节导航">
      <div class="toc-card">
        <p class="toc-label">本节导航</p>
        <p class="toc-chapter" id="toc-chapter"></p>
        <nav class="section-toc" id="section-toc"></nav>
      </div>
    </aside>
  </div>

  <aside class="drawer drawer--left" id="chapter-drawer" aria-label="移动端章节目录">
    <div class="drawer-head">
      <strong>章节目录</strong>
      <button class="drawer-close" type="button" data-close-drawer aria-label="关闭章节目录">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <nav class="chapter-nav" id="mobile-chapter-nav"></nav>
  </aside>

  <aside class="drawer drawer--right" id="section-drawer" aria-label="移动端本节导航">
    <div class="drawer-head">
      <strong>本节导航</strong>
      <button class="drawer-close" type="button" data-close-drawer aria-label="关闭本节导航">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <p class="toc-chapter" id="mobile-toc-chapter"></p>
    <nav class="section-toc" id="mobile-section-toc"></nav>
  </aside>

  <button class="page-mask" id="page-mask" type="button" aria-label="关闭导航"></button>

  <script>
    window.MD_FILE = "README.md";
  </script>

  <!-- 后期如需完全本地化，可将 marked.min.js 下载到本地后修改此处 src。 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

  <script>
    (() => {
      "use strict";

      const docBody = document.getElementById("doc-body");
      const statusBox = document.getElementById("doc-status");
      const chapterNav = document.getElementById("chapter-nav");
      const mobileChapterNav = document.getElementById("mobile-chapter-nav");
      const sectionToc = document.getElementById("section-toc");
      const mobileSectionToc = document.getElementById("mobile-section-toc");
      const tocChapter = document.getElementById("toc-chapter");
      const mobileTocChapter = document.getElementById("mobile-toc-chapter");
      const progress = document.getElementById("reading-progress");
      const localFile = document.getElementById("local-file");
      const chapterDrawer = document.getElementById("chapter-drawer");
      const sectionDrawer = document.getElementById("section-drawer");
      const pageMask = document.getElementById("page-mask");

      let chapters = [];
      let activeChapterId = "";
      let rafPending = false;

      function showStatus(message, type = "info", withFileButton = false) {
        statusBox.className = "doc-status is-visible" + (type === "error" ? " is-error" : "");
        statusBox.innerHTML = "";

        const text = document.createElement("div");
        text.textContent = message;
        statusBox.appendChild(text);

        if (withFileButton) {
          const button = document.createElement("button");
          button.className = "local-file-btn";
          button.type = "button";
          button.textContent = "选择本地 README.md";
          button.addEventListener("click", () => localFile.click());
          statusBox.appendChild(button);
        }
      }

      function hideStatus() {
        statusBox.className = "doc-status";
        statusBox.innerHTML = "";
      }

      function slugify(text, used) {
        let base = text
          .trim()
          .toLowerCase()
          .replace(/[`~!@#$%^&*()+=<>?:"{}|,[\]\\;/]/g, "")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");

        if (!base) base = "section";

        let slug = base;
        let index = 2;
        while (used.has(slug)) slug = `${base}-${index++}`;
        used.add(slug);
        return slug;
      }

      function prepareMarkdown() {
        const used = new Set();

        docBody.querySelectorAll("h1, h2, h3").forEach((heading) => {
          heading.id = slugify(heading.textContent, used);
        });

        docBody.querySelectorAll("table").forEach((table) => {
          if (table.parentElement?.classList.contains("table-scroll")) return;
          const wrap = document.createElement("div");
          wrap.className = "table-scroll";
          table.parentNode.insertBefore(wrap, table);
          wrap.appendChild(table);
        });

        const alertTypes = ["NOTE", "TIP", "IMPORTANT", "WARNING", "CAUTION"];
        docBody.querySelectorAll("blockquote").forEach((quote) => {
          const first = quote.firstElementChild;
          if (!first) return;

          const text = first.textContent.trim();
          const match = text.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
          if (!match) return;

          const type = match[1].toUpperCase();
          if (!alertTypes.includes(type)) return;

          first.textContent = text.replace(match[0], "").trim();
          quote.classList.add("md-alert", `md-alert-${type.toLowerCase()}`);

          const title = document.createElement("span");
          title.className = "md-alert-title";
          title.textContent = {
            NOTE: "说明",
            TIP: "提示",
            IMPORTANT: "重要",
            WARNING: "注意",
            CAUTION: "警告"
          }[type];

          quote.insertBefore(title, first);
          if (!first.textContent.trim()) first.remove();
        });

        docBody.querySelectorAll("a[href]").forEach((link) => {
          const href = link.getAttribute("href");
          if (href && /^https?:\/\//i.test(href)) {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          }
        });

        buildNavigation();
      }

      function buildNavigation() {
        const h2s = [...docBody.querySelectorAll("h2")];

        chapters = h2s.map((h2, index) => {
          const children = [];
          let node = h2.nextElementSibling;

          while (node && node.tagName !== "H2") {
            if (node.tagName === "H3") children.push(node);
            node = node.nextElementSibling;
          }

          return {
            id: h2.id,
            title: h2.textContent.trim(),
            element: h2,
            children,
            index
          };
        });

        renderChapterNav(chapterNav);
        renderChapterNav(mobileChapterNav);

        if (chapters.length) setActiveChapter(chapters[0].id);
      }

      function renderChapterNav(container) {
        container.innerHTML = "";

        chapters.forEach((chapter) => {
          const link = document.createElement("a");
          link.className = "chapter-link";
          link.href = `#${chapter.id}`;
          link.dataset.chapterId = chapter.id;
          link.textContent = chapter.title;
          link.addEventListener("click", closeDrawers);
          container.appendChild(link);
        });
      }

      function setActiveChapter(id) {
        if (!id || activeChapterId === id) return;
        activeChapterId = id;

        document.querySelectorAll(".chapter-link").forEach((link) => {
          link.classList.toggle("is-active", link.dataset.chapterId === id);
        });

        const chapter = chapters.find((item) => item.id === id);
        if (!chapter) return;

        renderSectionToc(sectionToc, chapter);
        renderSectionToc(mobileSectionToc, chapter);
        tocChapter.textContent = chapter.title;
        mobileTocChapter.textContent = chapter.title;
      }

      function renderSectionToc(container, chapter) {
        container.innerHTML = "";

        if (!chapter.children.length) {
          const empty = document.createElement("p");
          empty.className = "toc-empty";
          empty.textContent = "本章节暂无二级标题。";
          container.appendChild(empty);
          return;
        }

        chapter.children.forEach((heading) => {
          const link = document.createElement("a");
          link.className = "section-link";
          link.href = `#${heading.id}`;
          link.dataset.sectionId = heading.id;
          link.textContent = heading.textContent.trim();
          link.addEventListener("click", closeDrawers);
          container.appendChild(link);
        });
      }

      function updateScrollState() {
        rafPending = false;

        const offset = window.innerWidth <= 860 ? 118 : 90;
        let currentChapter = chapters[0] || null;

        for (const chapter of chapters) {
          if (chapter.element.getBoundingClientRect().top <= offset) {
            currentChapter = chapter;
          } else {
            break;
          }
        }

        if (currentChapter) setActiveChapter(currentChapter.id);

        const activeChapter = chapters.find((item) => item.id === activeChapterId);
        if (activeChapter && activeChapter.children.length) {
          let currentSection = activeChapter.children[0];

          for (const heading of activeChapter.children) {
            if (heading.getBoundingClientRect().top <= offset + 20) {
              currentSection = heading;
            } else {
              break;
            }
          }

          document.querySelectorAll(".section-link").forEach((link) => {
            link.classList.toggle("is-active", link.dataset.sectionId === currentSection?.id);
          });
        }

        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const percent = maxScroll > 0 ? Math.min(100, (scrollTop / maxScroll) * 100) : 0;
        progress.style.width = `${percent}%`;
      }

      function requestScrollUpdate() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(updateScrollState);
      }

      function openDrawer(drawer) {
        closeDrawers();
        drawer.classList.add("is-open");
        pageMask.classList.add("is-open");
        document.body.classList.add("is-locked");
      }

      function closeDrawers() {
        chapterDrawer.classList.remove("is-open");
        sectionDrawer.classList.remove("is-open");
        pageMask.classList.remove("is-open");
        document.body.classList.remove("is-locked");
      }

      async function renderMarkdown(markdownText) {
        if (!window.marked) {
          showStatus("Markdown 解析器加载失败，请检查网络后刷新页面。", "error");
          return;
        }

        hideStatus();

        marked.setOptions({
          gfm: true,
          breaks: false,
          headerIds: false,
          mangle: false
        });

        docBody.innerHTML = marked.parse(markdownText);
        prepareMarkdown();

        const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
        if (hash) {
          requestAnimationFrame(() => document.getElementById(hash)?.scrollIntoView());
        }

        requestAnimationFrame(updateScrollState);
      }

      async function loadMarkdownFile() {
        showStatus("正在读取 README.md…");

        try {
          const response = await fetch(window.MD_FILE, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          await renderMarkdown(await response.text());
        } catch (error) {
          const localMode = location.protocol === "file:";
          showStatus(
            localMode
              ? "浏览器直接打开 index.html 时通常会阻止自动读取本地 README.md。可选择本地 README.md 继续预览；上传到 GitHub Pages 后会自动读取。"
              : "README.md 读取失败，请确认 README.md 与 index.html 位于同一目录。",
            "error",
            true
          );
        }
      }

      localFile.addEventListener("change", async () => {
        const file = localFile.files?.[0];
        if (!file) return;
        await renderMarkdown(await file.text());
      });

      document.getElementById("chapter-toggle").addEventListener("click", () => openDrawer(chapterDrawer));
      document.getElementById("section-toggle").addEventListener("click", () => openDrawer(sectionDrawer));
      document.querySelectorAll("[data-close-drawer]").forEach((button) => button.addEventListener("click", closeDrawers));
      pageMask.addEventListener("click", closeDrawers);

      window.addEventListener("scroll", requestScrollUpdate, { passive: true });
      window.addEventListener("resize", requestScrollUpdate);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawers();
      });

      loadMarkdownFile();
    })();
  </script>
</body>
</html>
